---
layout: default
---
<div id="front-page">
  {% for post in paginator.posts %}
    <div>
      <h2><strong><a href="{{ post.url }}">{{ post.title }}</a></strong></h2>
      <div><a href="{{ post.url }}">{{ post.content }}</a></div>
      <div class="dadada"><a href="{{ post.url }}">{{ post.date | date: '%Y/%m/%d' }}</a></div>
    </div>
  {% endfor %}
</div>
