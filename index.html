---
layout: default
---
<div id="front-page">
  {% for post in paginator.posts %}
  <a href="{{ post.url }}">
    <div>
      <h2><strong>{{ post.title }}</strong></h2>
      <div>{{ post.content }}</div>
      <div class="dadada">{{ post.date | date: '%Y/%m/%d' }}</div>
    </div>
  </a>
  {% endfor %}
</div>
